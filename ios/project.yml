# Generates PocketWalls.xcodeproj. Run `xcodegen generate` in this folder.
# The app ID (BUNDLE_ID_BASE) and signing team live in Config.xcconfig, so
# regenerating the project keeps them.
name: PocketWalls
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PocketWalls:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pocket Walls
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        # The motion fonts in Shared/Fonts (tools/make_motion_fonts.py prints this list).
        UIAppFonts:
          - PWCarousel.ttf
          - PWDragon.ttf
          - PWEngine.ttf
          - PWHandDot.ttf
          - PWHandLong.ttf
          - PWHandNeedle.ttf
          - PWOrbit.ttf
          - PWOrbitWide.ttf
          - PWRaceA.ttf
          - PWRaceB.ttf
          - PWRaceC.ttf
          - PWRaceLights.ttf
          - PWRaceWheels.ttf
          - PWRiversAsia.ttf
          - PWRiversCanada.ttf
          - PWRiversJapan.ttf
          - PWRiversUsa.ttf
          - PWRoulette.ttf
          - PWSkeleton.ttf
          - PWStarsAquarius.ttf
          - PWStarsAries.ttf
          - PWStarsCancer.ttf
          - PWStarsCapricorn.ttf
          - PWStarsGemini.ttf
          - PWStarsLeo.ttf
          - PWStarsLibra.ttf
          - PWStarsPisces.ttf
          - PWStarsSagittarius.ttf
          - PWStarsScorpio.ttf
          - PWStarsTaurus.ttf
          - PWStarsVirgo.ttf
          - PWSweep.ttf
        NSPhotoLibraryAddUsageDescription: Pocket Walls saves wallpapers and icons to your photo library.
        LSApplicationQueriesSchemes:
          - shortcuts
          - whatsapp
          - instagram
          - youtube
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - pocketwalls
    entitlements:
      path: App/PocketWalls.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: PocketWallsWidgets
  PocketWallsWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: Widgets
      - path: Shared
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Pocket Walls
        AppGroupID: $(APP_GROUP_ID)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        UIAppFonts:
          - PWCarousel.ttf
          - PWDragon.ttf
          - PWEngine.ttf
          - PWHandDot.ttf
          - PWHandLong.ttf
          - PWHandNeedle.ttf
          - PWOrbit.ttf
          - PWOrbitWide.ttf
          - PWRaceA.ttf
          - PWRaceB.ttf
          - PWRaceC.ttf
          - PWRaceLights.ttf
          - PWRaceWheels.ttf
          - PWRiversAsia.ttf
          - PWRiversCanada.ttf
          - PWRiversJapan.ttf
          - PWRiversUsa.ttf
          - PWRoulette.ttf
          - PWSkeleton.ttf
          - PWStarsAquarius.ttf
          - PWStarsAries.ttf
          - PWStarsCancer.ttf
          - PWStarsCapricorn.ttf
          - PWStarsGemini.ttf
          - PWStarsLeo.ttf
          - PWStarsLibra.ttf
          - PWStarsPisces.ttf
          - PWStarsSagittarius.ttf
          - PWStarsScorpio.ttf
          - PWStarsTaurus.ttf
          - PWStarsVirgo.ttf
          - PWSweep.ttf
    entitlements:
      path: Widgets/PocketWallsWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE).widgets
