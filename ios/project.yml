          - PWStarsTaurus.ttf
          - PWStarsVirgo.ttf
          - PWSweep.ttf
        NSPhotoLibraryAddUsageDescription: Pocket Walls saves wallpapers and icons to your photo library.
        LSApplicationQueriesSchemes:
          - shortcuts
          - whatsapp
          - instagram
          - youtube
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes:
              - pocketwalls
    entitlements:
      path: App/PocketWalls.entitlements
      properties:
        com.apple.security.application-groups:
          - $(APP_GROUP_ID)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_BASE)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
