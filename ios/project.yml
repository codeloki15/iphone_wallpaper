# Generates PocketWalls.xcodeproj. Run `xcodegen generate` in this folder.
# The app ID (BUNDLE_ID_BASE) and signing team live in Config.xcconfig, so
# regenerating the project keeps them.
name: PocketWalls
options:
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
configFiles:
  Debug: Config.xcconfig
  Release: Config.xcconfig
settings:
  base:
    APP_GROUP_ID: group.$(BUNDLE_ID_BASE)
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1"
    CODE_SIGN_STYLE: Automatic
targets:
  PocketWalls:
    type: application
    platform: iOS
    sources:
      - path: App
      - path: Shared
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Pocket Walls
        AppGroupID: $(APP_GROUP_ID)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIUserInterfaceStyle: Dark
        # The motion fonts in Shared/Fonts (tools/make_motion_fonts.py prints this list).
        UIAppFonts:
          - PWBlink.ttf
          - PWCarousel.ttf
          - PWDragon.ttf
          - PWEngine.ttf
          - PWFigGlobe00.ttf
          - PWFigGlobe01.ttf
          - PWFigGlobe02.ttf
          - PWFigGlobe03.ttf
          - PWFigGlobe04.ttf
          - PWFigGlobe05.ttf
